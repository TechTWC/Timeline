name: Deploy Static Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pinned pnpm
        working-directory: web
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm --version

      - name: Install locked dependencies without lifecycle scripts
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Unit tests
        working-directory: web
        run: pnpm test

      - name: Build static frontend for GitHub Pages
        working-directory: web
        run: |
          pnpm exec tsc -b --pretty false
          pnpm exec vite build --base=/Timeline/

      - name: Ensure no sensitive files are in deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          if find web/dist -type f \( -iname '*timeline*.json' -o -iname '*.mp4' -o -iname '.env*' \) ! -name 'sample-timeline.json' | grep -q .; then
            echo 'Sensitive/generated file detected in Pages artifact.'
            find web/dist -type f \( -iname '*timeline*.json' -o -iname '*.mp4' -o -iname '.env*' \)
            exit 1
          fi
          echo 'Pages artifact privacy guard passed.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
